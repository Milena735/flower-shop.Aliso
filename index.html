<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветочный магазин "Букет"</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🌸 Цветы & Букеты</div>
    <div class="cart-icon" id="cartIcon">🛒 <span id="cartCount">0</span></div>
</header>

<section class="promo">
    <h2>🌿 Акция! 🌿</h2>
    <p>При заказе от 3000 ₽ — доставка бесплатно. + ромашка в подарок!</p>
</section>

<main>
    <h1>Наши букеты</h1>
    <div class="catalog" id="catalog"></div>
</main>

<!-- Корзина -->
<aside id="cartSidebar" class="cart-sidebar">
    <h3>🛍️ Корзина</h3>
    <div id="cartItems"></div>
    <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
    <button id="checkoutBtn">Оформить заказ</button>
    <button id="closeCartBtn">Закрыть</button>
</aside>

<!-- Модалка заказа -->
<div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Оформление заказа</h3>
        <form id="orderForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Телефон" required>
            <input type="text" id="address" placeholder="Адрес доставки" required>
            <button type="submit">Отправить заказ</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
