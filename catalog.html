<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог — Цветочный магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🌸 Цветы & Букеты</div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="catalog.html" class="nav-link">Каталог</a>
            <a href="about.html" class="nav-link">О нас</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
        </nav>
        <div class="cart-icon" id="cartIcon">🛒 <span id="cartCount">0</span></div>
    </header>

    <main>
        <h1>Каталог букетов</h1>
        <div class="catalog" id="catalog"></div>
    </main>

    <aside id="cartSidebar" class="cart-sidebar">
        <h3>🛍️ Корзина</h3>
        <div id="cartItems"></div>
        <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
        <button id="checkoutBtn">Оформить заказ</button>
        <button id="closeCartBtn">Закрыть</button>
    </aside>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Оформление заказа</h3>
            <form id="orderForm">
                <input type="text" id="name" placeholder="Ваше имя" required>
                <input type="tel" id="phone" placeholder="Телефон" required>
                <input type="text" id="address" placeholder="Адрес доставки" required>
                <button type="submit">Отправить заказ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
